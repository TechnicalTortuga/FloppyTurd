<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floppy Turd</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b08;color:#f1edce;font:16px system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;outline:none;touch-action:none}
#gate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:#111a11}
#gate[hidden]{display:none}button{font:inherit;padding:14px 30px;border:2px solid #dde28b;background:#25351f;color:#fff5ce;cursor:pointer}
#fullscreen{position:absolute;right:12px;top:12px;font-size:14px;padding:7px 12px;background:#111a11bb}#status{max-width:36em;text-align:center;padding:0 20px}#hint{font-size:14px;color:#c4c9b0}
#mobile-top{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:12px}
#mobile-bottom{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:48px}
#mobile-top[hidden],#mobile-bottom[hidden],[hidden]{display:none!important}
.mobile-control{min-width:56px;min-height:48px;padding:10px 16px;background:#202b1ee8;border-color:#e5d394;touch-action:none;user-select:none;-webkit-user-select:none}
#touch-jump,#touch-shoot{min-width:80px;min-height:60px;border-radius:12px}
#enable-audio{position:absolute;left:max(10px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));font-size:14px;padding:8px 12px}
#asset-error{position:absolute;top:65px;left:50%;transform:translateX(-50%);background:#202b1ef5;padding:8px 12px;max-width:90vw;font-size:14px}#asset-retry{padding:5px 10px}
@media(max-height:500px){#mobile-bottom{gap:90px}#touch-jump,#touch-shoot{min-height:48px}}
</style></head><body>
<canvas id="canvas" tabindex="0" aria-label="Floppy Turd game"></canvas>
<button id="fullscreen" hidden>Fullscreen</button>
<button id="enable-audio" hidden>Enable sound</button>
<div id="asset-error" hidden role="status">Some files could not load. <button id="asset-retry">Retry</button></div>
<div id="mobile-top" hidden><button id="touch-back" class="mobile-control" hidden>Back</button><button id="touch-pause" class="mobile-control" hidden>Pause</button></div>
<div id="mobile-bottom" hidden><button id="touch-jump" class="mobile-control">Jump</button><button id="touch-shoot" class="mobile-control" hidden>Shoot</button></div>
<div id="gate"><h1>Floppy Turd</h1><p id="status" role="status">Loading the game…</p><button id="play" hidden>Play Floppy Turd</button><p id="hint">Space: jump · S: shoot · Esc: pause</p></div>
<script src="bridge.js"></script>
{{{ SCRIPT }}}
</body></html>
